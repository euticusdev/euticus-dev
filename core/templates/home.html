
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand_name }} {{ brand_suffix }} | Build. Learn. Share.</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
   
    <header class="navbar">
        <div class="logo">&lt;/&gt;</div>
        <div class="divider"></div>

        <div class="brand">
            <h2>{{ brand_name }} <span>{{ brand_suffix }}</span></h2>
            <p>{{ tagline }}</p>
        </div>
    </header>

    <main class="hero">
        <h1>
            {{ headline }}
            <span>{{ highlight }}</span>
        </h1>

        <p>{{ description }}</p>

        <a href="#projects" class="button">Explore Projects</a>
    </main>
</body>
</html>
